[project]
name = "rallylab"
version = "0.1.0"
description = "Local table tennis video analysis and 3D replay for macOS"
requires-python = ">=3.14,<3.15"
dependencies = [
    "av>=18.1.0",
    "einops>=0.8.2",
    "fastapi>=0.141.1",
    "lap>=0.5.13",
    "numpy>=2.5.3",
    "omegaconf>=2.3.1",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "remotezip>=0.12.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tensorboard>=2.21.0",
    "ultralytics>=8.4.152",
    "uvicorn>=0.53.0",
]

[tool.pyright]
include = ["backend"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnnecessaryCast = "error"
reportImplicitOverride = "error"
reportPropertyTypeMismatch = "error"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# Mutually exclusive docstring styles and a rule that conflicts with Ruff format.
ignore = ["D203", "D213", "COM812"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "scipy-stubs>=1.18.1.0",
]

[tool.ruff.lint.per-file-ignores]
# Pytest assertions are the test interface; numeric literals are test expectations.
"backend/tests/*.py" = ["S101", "PLR2004"]
